<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bootstrap demo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<style>
		td {
			white-space: nowrap !important;
		}
	</style>
</head>
<body>
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-11 mx-auto">
				<div class="card-header bg-primary pt-3 d-flex justify-content-between">
					<h2 class="text-white">Visitors Data</h2>
					<a class="btn btn-danger" href="/addvisitor">Add Visitors</a>
				</div>
				<div class="card-body p-3">
					<table class="table table-bordered">
						<tr>
							<th>Sr .No</th>
							<th>Name</th>
							<th>Contact No.</th>
							<th>Email</th>
							<th>Address</th>
							<th>Purpose</th>
							<th>In Time</th>
							<th>Out Time</th>
						</tr>
						<tr th:each="v,i :${visitors}">
							<td th:text="${i.index+1}">1</td>
							<td th:text="${v.name}">Suhel Shekh</td>
							<td th:text="${v.contactNo}">0000000000</td>
							<td th:text="${v.email}">exam@gmail.com</td>
							<td th:text="${v.address}">pata mahi</td>
							<td th:text="${v.purpose}">I Dont know</td>
							<td th:text="${v.inTime}">In Time</td>
							<td th:text="${v.outTime}">Out Time</td>
							<td><a th:href="'/updateTime/' +${v.id}" class="btn btn-small btn-success">Update Time</a>
								<a onclick="return confirm('Are you sure want to delete?')"
									th:href="'/deleteVisitor/' +${v.id}" class="btn btn-small btn-danger">Delete</a>
							</td>
						</tr>
					</table>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
