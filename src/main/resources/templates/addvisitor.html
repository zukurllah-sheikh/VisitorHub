<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Visitor Data</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-8">
				<div class="card shadow">
					<div class="card-header bg-primary text-white d-flex justify-content-between">
						<h3 class="text-center">Add Visitors Data</h3>
						<a href="/" class="btn btn-warning">Go To Home</a>
					</div>
					<div class="card-body">
						<form th:action="@{/addvisitor}" method="post" th:object="${dto}">
							<div class="row">
								<div class="col-md-6 mb-3">
									<label class="form-label">Visitor Name</label> <input type="text"
										class="form-control" th:field="*{name}" placeholder="Enter Name..." required>
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Contact Number</label> <input type="text"
										class="form-control" th:field="*{contactNo}"
										placeholder="Enter Contact Number..." required>
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Email</label> <input type="email" class="form-control"
										th:field="*{email}" placeholder="Enter Email..." required>
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Address</label> <input type="text" class="form-control"
										th:field="*{address}" placeholder="Enter Address..." required>
								</div>
								<div class="col-12 mb-3">
									<label class="form-label">Purpose</label>
									<textarea class="form-control" rows="4" th:field="*{purpose}"
										placeholder="Purpose of Visit..." required></textarea>
								</div>
								<div class="col-12 text-center">
									<button type="submit" class="btn btn-primary px-5">
										Add Visitor</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
